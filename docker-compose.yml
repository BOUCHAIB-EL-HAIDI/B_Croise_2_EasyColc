
services:

  php:
    build: .
    container_name: php3
    ports:
      - "${PHP_PORT}:${PHP_PORT}"
    volumes:
      - "./src:/var/www/html"
    depends_on:
      - postgres
    networks:
      - app-network
    command: php artisan serve --host=0.0.0.0 --port=${PHP_PORT}

  postgres:
    image: postgres:17-alpine
    container_name: postgres3
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "2004:${PGADMIN_PORT}"
    networks:
      - app-network
    volumes:
      - pgtables:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin3
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  pgtables:
networks:
  app-network:
    driver: bridge
